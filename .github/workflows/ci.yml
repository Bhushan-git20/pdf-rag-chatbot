name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Lint & Pytest Suite
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Lint with flake8
      run: |
        # Stop build if syntax errors or undefined names occur
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats formatting as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Run Test Suite with Pytest
      env:
        GEMINI_API_KEY: "mock_ci_gemini_key"
        GROQ_API_KEY: "mock_ci_groq_key"
      run: |
        pytest tests/ -v

  docker-build:
    name: Docker Container Build
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Container Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: pdf-rag-chatbot:ci-test
